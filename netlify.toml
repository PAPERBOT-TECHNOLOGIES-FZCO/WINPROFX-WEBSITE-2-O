[build]
  command = "npx playwright install chromium && npm run build"
  publish = "dist"

[build.environment]
  PLAYWRIGHT_BROWSERS_PATH = "0"

# Domain alias redirects: winprofx.com / winprofx.ae → winprofx.org (primary).
# Uses full-URL patterns (Netlify domain-level redirect syntax).
# Does not affect my.winprofx.org or partner.winprofx.org (separate sites).
# Also mirrored in public/_redirects (processed first by Netlify).

[[redirects]]
  from = "https://winprofx.com/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.winprofx.com/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://winprofx.com/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.winprofx.com/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://winprofx.ae/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.winprofx.ae/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://winprofx.ae/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.winprofx.ae/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

# SEO-friendly market slug aliases (301 to canonical pages)
[[redirects]]
  from = "/forex-trading"
  to = "/forex"
  status = 301

[[redirects]]
  from = "/forex-trading/*"
  to = "/forex/:splat"
  status = 301

[[redirects]]
  from = "/gold-trading"
  to = "/trading/metals"
  status = 301

[[redirects]]
  from = "/oil-trading"
  to = "/trading/oil"
  status = 301

[[redirects]]
  from = "/indices-trading"
  to = "/indices"
  status = 301

[[redirects]]
  from = "/crypto-cfd-trading"
  to = "/crypto"
  status = 301

[[redirects]]
  from = "/commodities-trading"
  to = "/trading/commodities"
  status = 301

[[redirects]]
  from = "/mt5-trading-platform"
  to = "/platform"
  status = 301

[[redirects]]
  from = "/account-types"
  to = "/accounts"
  status = 301

# Slug aliases for common URL patterns
[[redirects]]
  from = "/privacy-policy"
  to = "/policy"
  status = 301

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms"
  status = 301

# Redirect /en/* to unprefixed English URLs (avoid duplicate English content)
[[redirects]]
  from = "/en"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301

# SPA catch-all (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
