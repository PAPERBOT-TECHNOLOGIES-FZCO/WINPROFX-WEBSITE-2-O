[build]
  command = "npm run build"
  publish = "dist"

# Domain alias redirects: winprofx.com / winprofx.ae → winprofx.org (primary).
# Does not affect my.winprofx.org or partner.winprofx.org (separate sites).

[[redirects]]
  from = "/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true
  conditions = { Host = ["winprofx.com", "www.winprofx.com"] }

[[redirects]]
  from = "/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true
  conditions = { Host = ["winprofx.ae", "www.winprofx.ae"] }

# Slug aliases for common URL patterns
[[redirects]]
  from = "/privacy-policy"
  to = "/policy"
  status = 301

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms"
  status = 301

# SPA catch-all (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
