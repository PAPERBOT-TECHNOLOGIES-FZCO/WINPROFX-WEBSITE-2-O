[build]
  command = "npm run build"
  publish = "dist"

# Canonical domain: redirect alias domains to winprofx.org
[[redirects]]
  from = "/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true
  conditions = { Host = ["winprofx.com", "www.winprofx.com"] }

[[redirects]]
  from = "/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true
  conditions = { Host = ["winprofx.ae", "www.winprofx.ae"] }

# Slug aliases for common URL patterns
[[redirects]]
  from = "/about"
  to = "/about-us"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to = "/policy"
  status = 301

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms"
  status = 301

[[redirects]]
  from = "/risk-warning"
  to = "/risk-disclosure"
  status = 301

# SPA catch-all (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
