[build]
  command = "npx playwright install chromium && npm run build"
  publish = "dist"

[build.environment]
  PLAYWRIGHT_BROWSERS_PATH = "0"

# Domain alias redirects: winprofx.com / winprofx.ae → winprofx.org (primary).
# Uses full-URL patterns (Netlify domain-level redirect syntax).
# Does not affect my.winprofx.org or partner.winprofx.org (separate sites).
# Also mirrored in public/_redirects (processed first by Netlify).

[[redirects]]
  from = "https://winprofx.com/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.winprofx.com/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://winprofx.com/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.winprofx.com/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://winprofx.ae/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.winprofx.ae/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://winprofx.ae/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.winprofx.ae/*"
  to = "https://winprofx.org/:splat"
  status = 301
  force = true

# Slug aliases for common URL patterns
[[redirects]]
  from = "/privacy-policy"
  to = "/policy"
  status = 301

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms"
  status = 301

# SPA catch-all (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
